# ═══════════════════════════════════════════════════════════════
# 🏆 MUNDIAL-OPS 2030 — Pipeline CI/CD
# Déclenché automatiquement à chaque push ou pull request sur main
# 4 jobs en parallèle : tests, build, security, quality
# ═══════════════════════════════════════════════════════════════

name: 🚀 MUNDIAL-OPS 2030 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Permet le déclenchement manuel depuis GitHub UI

# Variables d'environnement globales
env:
  PYTHON_VERSION: '3.11'

jobs:

  # ═════════════════════════════════════════════════════════════
  # JOB 1 — Tests unitaires Python sur les 3 services (en parallèle)
  # ═════════════════════════════════════════════════════════════
  tests:
    name: 🧪 Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # On continue même si un service échoue
      matrix:
        service: [billetterie, streaming, stade]

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Installation des dépendances
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Exécution des tests pytest
        working-directory: services/${{ matrix.service }}
        run: |
          pytest test_app.py -v --tb=short

      - name: ✅ Résumé
        if: always()
        run: echo "🏁 Tests du service ${{ matrix.service }} terminés"


  # ═════════════════════════════════════════════════════════════
  # JOB 2 — Build des 3 images Docker (en parallèle)
  # ═════════════════════════════════════════════════════════════
  docker-build:
    name: 🐳 Build Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: tests  # Ne build que si les tests passent
    strategy:
      fail-fast: false
      matrix:
        service: [billetterie, streaming, stade]

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build de l'image ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false  # On ne push pas vers un registry pour ce projet étudiant
          tags: mundial-ops-2030/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Build terminé
        run: echo "🐳 Image ${{ matrix.service }} construite avec succès"


  # ═════════════════════════════════════════════════════════════
  # JOB 3 — Validation de l'orchestration Docker Compose
  # ═════════════════════════════════════════════════════════════
  compose-validation:
    name: 🎼 Validation Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Créer un .env factice pour la validation
        run: |
          echo "# Fichier .env factice pour CI uniquement" > .env
          echo "GROQ_API_KEY=ci_dummy_key_not_real" >> .env
          echo "GROQ_MODEL=llama-3.3-70b-versatile" >> .env
          echo "✅ .env factice créé pour la validation CI"

      - name: 🔍 Validation syntaxe docker-compose.yml
        run: |
          docker compose config --quiet
          echo "✅ docker-compose.yml est valide"

      - name: 📋 Liste des services orchestrés
        run: |
          echo "Services définis dans la stack :"
          docker compose config --services

      - name: 🧹 Nettoyage du .env factice
        if: always()
        run: rm -f .env


  # ═════════════════════════════════════════════════════════════
  # JOB 4 — Scan de sécurité basique
  # ═════════════════════════════════════════════════════════════
  security-scan:
    name: 🔒 Scan de sécurité
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔐 Détection de secrets dans le code
        run: |
          echo "🔍 Vérification qu'aucun secret n'est commit dans le code..."
          # Recherche basique de patterns suspects
          if grep -rE "(password|secret|api_key|token)\s*=\s*['\"][^'\"]{8,}" --include="*.py" --include="*.yml" --include="*.yaml" .; then
            echo "⚠️  Attention : possibles secrets détectés (vérifier manuellement)"
          else
            echo "✅ Aucun secret évident détecté dans le code"
          fi

      - name: 📊 Statistiques du projet
        run: |
          echo "📈 Statistiques du dépôt MUNDIAL-OPS 2030 :"
          echo "  • Fichiers Python : $(find . -name '*.py' | wc -l)"
          echo "  • Fichiers Dockerfile : $(find . -name 'Dockerfile' | wc -l)"
          echo "  • Fichiers YAML : $(find . -name '*.yml' -o -name '*.yaml' | wc -l)"


  # ═════════════════════════════════════════════════════════════
  # JOB 5 — Rapport final
  # ═════════════════════════════════════════════════════════════
  summary:
    name: 📊 Rapport final
    runs-on: ubuntu-latest
    needs: [tests, docker-build, compose-validation, security-scan]
    if: always()

    steps:
      - name: 🏆 Synthèse du pipeline
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  🏆 MUNDIAL-OPS 2030 — Rapport du pipeline CI/CD         ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🧪 Tests unitaires       : ${{ needs.tests.result }}    "
          echo "║  🐳 Build Docker          : ${{ needs.docker-build.result }}    "
          echo "║  🎼 Validation Compose    : ${{ needs.compose-validation.result }}    "
          echo "║  🔒 Scan sécurité         : ${{ needs.security-scan.result }}    "
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "🇲🇦 🇪🇸 🇵🇹 — Coupe du Monde 2030"