# ═══════════════════════════════════════════════════════════════
# 🏆 MUNDIAL-OPS 2030 — Orchestrateur Docker Compose
# 3 microservices répartis sur Maroc, Espagne, Portugal
# Démarrage : docker compose up
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────
  # 🎫 BILLETTERIE — Casablanca 🇲🇦
  # ─────────────────────────────────────────────────────────
  billetterie:
    build: ./services/billetterie
    container_name: mundial-billetterie
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=billetterie
      - REGION=casablanca
      - COUNTRY=morocco
    restart: unless-stopped
    networks:
      - mundial-net
    labels:
      - "mundial.service=billetterie"
      - "mundial.region=casablanca"
      - "mundial.country=morocco"

  # ─────────────────────────────────────────────────────────
  # 📺 STREAMING — Madrid 🇪🇸
  # ─────────────────────────────────────────────────────────
  streaming:
    build: ./services/streaming
    container_name: mundial-streaming
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=streaming
      - REGION=madrid
      - COUNTRY=spain
    restart: unless-stopped
    networks:
      - mundial-net
    labels:
      - "mundial.service=streaming"
      - "mundial.region=madrid"
      - "mundial.country=spain"

  # ─────────────────────────────────────────────────────────
  # 🏟️ STADE — Lisbonne 🇵🇹
  # ─────────────────────────────────────────────────────────
  stade:
    build: ./services/stade
    container_name: mundial-stade
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=stade
      - REGION=lisbonne
      - COUNTRY=portugal
    restart: unless-stopped
    networks:
      - mundial-net
    labels:
      - "mundial.service=stade"
      - "mundial.region=lisbonne"
      - "mundial.country=portugal"

# ─────────────────────────────────────────────────────────────
# Réseau interne pour la communication entre services
# ─────────────────────────────────────────────────────────────
networks:
  mundial-net:
    driver: bridge
    name: mundial-network